schema_version: policyengine_ledger.approved_agents.v1
owners:
  github_team: PolicyEngine/core-developers
approved_agents:
  - id: ledger-source-ingestor
    purpose: Add or update source packages that emit raw publisher-backed facts.
    allowed_paths:
      - packages/**
      - chronicle/jurisdictions/**
      - chronicle/sources/**
      - tests/test_chronicle_*.py
      - tests/test_source_*.py
      - tests/test_etl_*.py
    required_deterministic_checks:
      - source-package validation
      - source-cell preservation
      - consumer-contract validation
      - raw-facts boundary validation
    required_judges:
      - ledger-source-fidelity
      - ledger-boundary
  - id: ledger-contract-maintainer
    purpose: Change Chronicle schemas, identity, provenance, or consumer contracts.
    allowed_paths:
      - chronicle/core.py
      - chronicle/consumer_contract.py
      - policyengine_chronicle/**
      - docs/schemas/**
      - tests/test_chronicle_consumer_contract.py
      - tests/test_chronicle_core.py
      - tests/test_policyengine_chronicle_imports.py
    required_deterministic_checks:
      - schema validation
      - consumer-contract validation
      - package import compatibility
      - raw-facts boundary validation
    required_judges:
      - ledger-contract
      - ledger-boundary
required_judges:
  ledger-source-fidelity:
    verdict: PASS if every new fact is directly traceable to publisher bytes/cells and no source values are invented.
  ledger-contract:
    verdict: PASS if schema or identity changes preserve source provenance and do not move Microcosm responsibilities into Chronicle.
  ledger-boundary:
    verdict: PASS if reconciliation, aging, imputation, support-aware activation, and solver construction remain outside Chronicle; no microdata records, rows, columns, row values, or cells enter any Chronicle parsed-source surface, registry, derived artifact, or journal; no fact computed from raw microdata by Chronicle or by a PolicyEngine-side consumer (Microcosm, PolicyEngine, Thesis, or any system that builds from a Chronicle registration) enters Chronicle, however many intermediate artifacts stand between them, while a value that a third party asserted and published, whether the microdata's own publisher or another, is an ordinary fact with ordinary provenance; no licensed or restricted microdata bytes enter any Chronicle store, and public microdata bytes enter only with artifact-bound redistribution evidence (docs/adr-chronicle-raw-microdata-identity.md).
