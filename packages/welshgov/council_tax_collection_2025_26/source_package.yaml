# Welsh Government, Council tax collection rates in Wales, 2025-26
# (statistical release, June 2026). Table 2 prints, for each of the 22 billing
# authorities and for Wales, the amounts outstanding in respect of 2025-26
# bills and arrears in GBP thousands: arrears brought forward, prior-year
# debits and credits, arrears collected and written off, the in-year total
# debits (the net collectable debit: the council tax for the year that
# authorities would collect if everyone liable had paid, net of the council
# tax reduction scheme), the amounts collected and written off in year, and
# the in-year collection rate. Publisher note 3: the amounts are net of all
# deductions on council tax bills, such as council tax reduction scheme.
#
# Ported: the 'Total Wales' row, publisher columns 1, 2, 3, 4, 6, 7 and 9.
# Excluded: columns 5, 8, 10, 11 and 12, which the publisher labels as
# formulas over the other columns (5=(1+2-3-4), 8=(7/6), 10=(6-7-9),
# 11=(10+5), 12=(11-1)), so the in-year collection rate is consumer arithmetic
# (column 7 over column 6); the 22 per-authority rows (wave-3 local-geography
# scope, in this pinned artifact); and Table 1, which prints collection rates
# as percentages (the current-year rate is column 8's ratio, the previous-year
# rate is a revised restatement of the earlier release, and a memo 'assumed
# collection rate' is a budget assumption) and is outside this amounts-only
# package. Values are the workbook's stored cells (H27 is 2403994.83 in GBP
# thousand behind a '#,##0' format; its .83 is GBP 830). Split-year labels
# store the opening year: 2025-26 is fiscal_year 2025.
#
# gov.wales 403s a plain fetch; the workbook was retrieved with browser
# headers and pinned byte-for-byte (sha256 in manifest.yaml).
