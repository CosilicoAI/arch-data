# Welsh local authority bus finance, which the landed
# welshgov-bus-statistics-2024-25 package could not carry: the Public Service
# Vehicles release reports passenger journeys and has no fare revenue or public
# support series. StatsWales does carry it, on the roads and transport revenue
# outturn dataset, whose "Concessionary fares" and "Support to operators"
# service lines are the two bus-finance lines the revenue outturn forms collect
# (lines 26 and 27 of the RO2 return).
#
# The artifact is the publisher's own unfiltered CSV export of the whole
# dataset, 132,238 rows covering 2002-03 to 2024-25 and every service line, so
# the bytes are the publisher's and nothing was reshaped on the way in. The
# package selects the public transport lines from it with selected_rows, which
# is what keeps the source-cell lineage proportionate to the facts emitted
# rather than to the whole dataset.
#
# The download URL carries a StatsWales-issued token in its path. It resolves
# without a session and is recorded as fetched, but it is a service endpoint
# rather than a permanent document address; the manifest source_page is the
# dataset landing page.
#
# Authorities: the publisher's "Total Unitary Authorities" row is the Wales
# total and is recorded at W92000004; the 22 named authorities are recorded at
# their GSS codes. Three fiscal years are ported so the consumer can see the
# level and its recent movement, not just one year.
#
# Signs follow the publisher: income and grant lines are negative because the
# revenue outturn forms record them as deductions from gross expenditure.
# Net current expenditure is gross expenditure plus total income; grants are
# reported separately and are not inside net current expenditure. The service
# lines are filtered by the publisher's own labels, declared per row in
# source_row_dimensions, because the StatsWales long format names its pivot
# axes "Row" and "Column" rather than naming the dimensions they carry.
schema_version: ledger.source_package.v1
package_id: welshgov-transport-revenue-outturn-2024-25
dimension_labels:
  'welshgov.authority': 'Local authority'
dimension_value_labels:
  'expenditure_component':
    'Grants': 'Grants'
    'Gross expenditure': 'Gross expenditure'
    'Net current expenditure': 'Net current expenditure'
    'Total income': 'Total income'
  'service_line':
    'Concessionary fares': 'Concessionary fares'
    'Support to operators': 'Support to operators'
    'Total public transport': 'Total public transport'
