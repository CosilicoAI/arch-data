# Welsh Government, Council Tax Reduction Scheme (CTRS): annual report 2024 to
# 2025 (PDF, published August 2025). Table 2 'Total value of CTRS awards in
# Wales' prints, for each of the 22 billing authorities and for Wales, the
# estimated total value of reductions provided through the scheme in 2023-24
# and 2024-25 in GBP thousand (source: Datatank Connect), with a '% change'
# column. Paraphrasing the report: the value of reductions is the amount by
# which the council tax liability of households receiving a council tax
# reduction is reduced, and local authorities are funded to replace the
# council tax income they would otherwise raise from those households. This is
# the Welsh CTRS cost that the collection-rates release (net of CTRS) and the
# report's caseload annex do not carry.
#
# The publisher PDF is the artifact and is parsed with the repo's
# pdf_text_numbers parser (the LIHEAP, ISC and PIP precedents): every number
# on every text line becomes a row of the 'document_numbers' sheet with its
# page, line, line text, number text and context, and the package selects the
# Wales row's two totals by their line text and number text, guarded by the
# page and line numbers and the table-title line.
#
# Ported: the Wales row's 2023-24 and 2024-25 totals, one record set per year
# because a period is not a measure; 2023-24 also appears in the previous
# report, where the same value is printed, so a consumer selecting that year
# pins the source_table. Excluded: the '% change' column (publisher-labelled
# arithmetic over the two totals) and the 22 authority rows (wave-3
# local-geography scope). The caseload tables (annex workbook) are counts and
# out of scope. Split-year labels store the opening year: 2024-25 is
# fiscal_year 2024.
#
# gov.wales 403s a plain fetch (a bare Mozilla user agent included); the PDF
# was retrieved with a full browser user agent and Accept headers and is
# pinned byte-for-byte (sha256 in manifest.yaml).
