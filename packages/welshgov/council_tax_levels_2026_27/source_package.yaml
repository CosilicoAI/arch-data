# Welsh Government council tax levels, April 2026 to March 2027: average Band D
# and its precept elements per unitary authority (Table 1), and the budget
# requirement and council tax income per authority (Table 3).
#
# Two of the three publisher values the wave-3 coverage audit found missing live
# here. Wales publishes its council tax income directly, where England's net
# council tax has to be derived from taxbase x Band D - so the Welsh figure is a
# fact, not a computation.
#
# Excluded rows: 'Wales average' in Table 1 and, in Table 3, 'Total counties',
# 'Total police', 'Total Wales' and the four police authorities. The totals are
# sums or averages over the ported rows; the police authorities are precepting
# bodies with no local-authority GSS code.
#
# Excluded columns: Table 3's 'Change (GBP m)' and 'Change (%)', which are the
# difference and percentage change of two ported columns.
#
# Amounts are published in GBP millions and carry value_scale 1000000; the
# Band D figures are in pounds. The workbook is name-keyed, so each row's W06
# code is authored from the TS041 household-count package, which carries both,
# and guarded by the publisher's exact authority name.
