package_id: ofgem-energy-price-cap-q1-2024
label: Ofgem average direct-debit unit rates and standing charges, January to March 2024
dimension_labels:
  'ofgem.price_component': 'Price component'
  'payment_method': 'Payment method'
dimension_value_labels:
  'payment_method':
    'direct_debit': 'Direct debit'
  'quarter':
    'Q1': 'Q1'
artifact:
  source_name: ofgem
  source_table: New energy price cap level for January to March 2024
  resource_package: db
  resource_directory: data/ofgem/energy_price_cap_q1_2024
  manifest: manifest.yaml
  vintage: q1_2024
  extracted_at: '2026-09-09'
  extraction_method: HTML table and document-text number parse; official release exposes GB-average direct-debit
    rates, not regional rates
  parser: html_tables_and_text
  artifact_year: 2024
