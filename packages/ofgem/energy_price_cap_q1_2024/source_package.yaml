  - value_id: electricity_unit_rate
    label: Electricity unit rate
    ordinal: 0
    row_number: 11
    table_record_kind: detail
    expected_row_header_column: C
    expected_row_header: 'If you are on a standard variable tariff (default tariff) and pay for your electricity by Direct Debit, you will pay on average 28.62 pence per kilowatt hour (kWh). The daily standing charge is 53.35 pence per day. This is based on the average across England, Scotland and Wales and includes VAT.'
    guard_cells:
    - column: D
      expected_value: '28.62'
      label: published numeric token
    filters:
      quarter: Q1
      payment_method: direct_debit
      price_component: electricity_unit_rate
    constraints:
