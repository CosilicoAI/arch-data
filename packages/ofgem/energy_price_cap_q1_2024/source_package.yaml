  geography_vintage: current
  entity: household
  entity_role: default_tariff_customer
  domain: domestic_energy_prices
  groupby_dimension: ofgem.price_component
  rows:
  - value_id: electricity_unit_rate
    label: Electricity unit rate
    ordinal: 0
    row_number: 11
    table_record_kind: detail
    expected_row_header_column: D
    expected_row_header: '28.62'
    filters:
      quarter: Q1
      payment_method: direct_debit
      price_component: electricity_unit_rate
    constraints:
    - variable: quarter
      operator: ==
      value: Q1
