      operator: ==
      value: Q1
      label: Quarter
    - variable: payment_method
      operator: ==
      value: direct_debit
      label: Payment Method
    - variable: price_component
      operator: ==
      value: electricity_unit_rate
      label: Price Component
  measures:
  - measure_id: electricity_unit_rate
    label: Electricity unit rate
    ordinal: 0
    column: E
    source_column_id: electricity_unit_rate
    concept: ofgem.price_cap.electricity_unit_rate
    source_concept: ofgem.price_cap.electricity_unit_rate
