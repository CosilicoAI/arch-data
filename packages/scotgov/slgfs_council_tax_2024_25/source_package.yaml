# Scottish Local Government Finance Statistics (SLGFS) 2024-25, publication
# tables (first published 3 February 2026; the pinned workbook is the 5
# February 2026 re-issue: Table 2.14a was revised on 4 February and Chart 2.1
# on 5 February, neither of them a sheet this package reads). The council-tax
# tables carry the Scotland-level Council Tax Reduction (CTR) cost that the
# collection statistics only describe: Table 2.11 prints CTR funding from the
# Scottish Government and the final total reduction in liability (source: CTR
# extracts and LFR 12); Table 2.8 prints council tax income after CTR (LFR
# A0); Table 2.6 prints the same income as a general funding source for
# 2020-21 to 2024-25 (LFR A0); Chart 2.7 prints the 2024-25 potential-yield
# breakdown by band (council tax billed estimate, CTR, single person discount,
# exempt dwellings, other discounts); Table 2.10 prints the average bill per
# dwelling before and after CTR for 2020-21 to 2024-25 (CTAS, CTaxbase and LFR
# 12).
#
# Ported: the Scotland rows of Tables 2.8 and 2.11 (GBP thousands, value_scale
# 1000; Table 2.11's CTR funding cell is stored as 350999.99999999977, the
# workbook's own float for GBP 351,000 thousand, and is carried as stored);
# Table 2.6's 'Council Tax' row for 2020-21 to 2023-24 (GBP millions,
# value_scale 1000000) under the same concept as Table 2.8, because its
# 2024-25 cell equals the Table 2.8 Scotland total exactly and is carried
# once, from Table 2.8; the whole Chart 2.7 table, six component rows
# including the 'Gross Potential Council Tax' total row (table_record_kind
# total) x bands A-H plus the 'Total' column (GBP millions, value_scale
# 1000000; band in the measure filter, component in the row filter); all five
# years of Table 2.10 (GBP per dwelling, aggregation mean, one record set per
# year because a period is not a measure; 'per dwelling' is read as per
# chargeable dwelling, which the CTR arithmetic of the sheet supports).
#
# Excluded: the 32 per-authority rows of Tables 2.8 and 2.11 (wave-3
# local-geography scope; they sit in this pinned artifact); Table 2.6's
# 2024-25 cell (as above) and its '% change' column (publisher-labelled
# arithmetic); Tables 2.7, 2.9, 2.12, 2.13 and Charts 2.8 and 2.9, which are
# band ratios, dwelling counts (including Table 2.13's Scotland-level count of
# Council Tax Reduction recipients, a caseload rather than an amount),
# definitions and a Band D rate already carried for every year by
# scotgov-band-d-council-tax-rates-2026-27. Chart 2.7's CTR total (GBP 390.3m,
# CTRR-based estimate) and Table 2.11's reduction in liability (GBP 389.0m,
# CTR extracts and LFR 12) are two publisher measures of the same cost and are
# both ported.
#
# The collection statistics' 'Further context' page attributes Figure 9 to
# SLGFS Chart 2.7. The GBP 389m Scottish CTR cost quoted in the
# policyengine-uk-data#448 diagnosis (the _uk-defects-452-448 report) is Table
# 2.11's Scotland total; its comparator file cited a news release that carries
# no CTR amount.
#
# The workbook was fetched with browser headers (gov.scot has intermittently
# blocked non-browser fetches) and is pinned byte-for-byte (sha256 in
# manifest.yaml).
schema_version: ledger.source_package.v1
package_id: scotgov-slgfs-council-tax-2024-25
label: 'Scottish Local Government Finance Statistics 2024-25: council tax income after CTR
  (2020-21 to 2024-25), CTR funding and reduction in liability, potential yield by band, and
  average bill before and after CTR, Scotland'
