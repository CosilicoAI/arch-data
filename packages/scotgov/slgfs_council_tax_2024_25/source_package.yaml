  'scotgov.geography_row': 'Geography'
  'scotgov.potential_yield_component': 'Council tax potential yield component'
dimension_value_labels:
  'council_tax_band':
    'A': 'Band A'
    'B': 'Band B'
    'C': 'Band C'
    'D': 'Band D'
    'E': 'Band E'
    'F': 'Band F'
    'G': 'Band G'
    'H': 'Band H'
