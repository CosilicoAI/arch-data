# Scottish Budget 2026-27, Table 5.08 Social Security Assistance (Level 3),
# from the archived Chapter 5 Social Justice HTML page (the budget's Stage-2
# supporting workbook carries only amended chapters, not Chapter 5).
# Ported: the assistance lines + the Total Social Security Assistance row,
# three fiscal-year columns. FY2024-25 is outturn (assertion observation);
# FY2025-26 ABR and FY2026-27 are budget allocations (source_projection).
# Named exclusions: publisher '-' cells (Scottish Welfare Fund FY2025-26;
# Two Child Limit Payment FY2024-25 and FY2026-27) are skipped, not
# zero-filled; the Two Child Limit Payment FY2025-26 GBP 11.3m allocation is
# NOT ported because the publisher's own same-table footnote withdraws it
# ("funding ... is no longer required. The GBP 11.3 million allocated in
# 2025-26 will be removed at Spring Budget Revision"); and the table's
# trailing 'of which' presentational block (Fiscal Resource, Non-cash,
# Capital, FTs, UK Funded AME) is out of scope - the package ports
# assistance lines, not funding-classification splits. policyengine-uk-data
# transcribes only the Scottish Child Payment line (455.8 / 471.0 / 484.8)
# and extends 2027-2029 by 3% growth - that uprating is excluded per the
# facts-only ADR. uk-data's pinned URL pages/6 now serves Chapter 4; the
# chapter pagination drifted and this package pins pages/7.
