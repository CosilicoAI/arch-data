package_id: scotgov-bus-coach-statistics-2024-25
label: Transport Scotland bus and coach statistics, 2024-25
artifact:
  source_name: scotgov
  source_table: Scottish Transport Statistics 2025 bus and coach reference tables
  resource_package: db
  resource_directory: data/scotgov/bus_coach_statistics_2024_25
  manifest: manifest.yaml
  vintage: '2024_25'
  extracted_at: '2026-09-10'
  extraction_method: XLS whole-workbook used-range cell parse
  parser: xls_used_range
  artifact_year: 2025
