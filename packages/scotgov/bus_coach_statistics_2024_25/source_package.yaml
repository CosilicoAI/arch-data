# The Scottish Transport Statistics 2025 edition of the bus and coach chapter,
# which carries FY2024-25 where the landed scotgov-bus-coach-statistics-2023-24
# package stopped at FY2023-24. Same workbook layout as the 2024 edition with
# one column added per table, so the record sets mirror it and shift the
# measure column: Table 2.2a and Table 2.8 to AL, table 2.5 to AG (a calendar
# year, so 2025 not FY2024-25) and Table 2.9 to X.
#
# This edition adds the two Table 2.8 rows the 2024-edition package did not
# take, government support and total passenger revenue, because the follow-up
# asks for the support components alongside passenger revenue.
#
# Table 2.9 publishes Scotland on two scopes, "(bus)" and "(all modes)", which
# carry identical values for every recent year; only the bus rows are ported,
# matching the 2024-edition package.
