# ScotGov CTAS 2026 Council Tax Assumptions: average Band D council tax rate for
# Scotland and each of the 32 council areas, every year from 1996-97 to 2026-27.
#
# The Scottish leg of the Band D value the wave-3 coverage audit found missing.
# Split-year labels store the opening year, so 2026-27 is fiscal_year 2026, and
# each year is its own record set because a period is not a measure.
#
# ScotGov spells four councils with '&' where ONS uses 'and', and writes
# 'Shetland  Islands' with two spaces. The row guards carry the publisher's exact
# string; only the S12 code lookup is aliased, and the codes come from the
# local-authority age package, which carries name and code together.
#
# Excluded: the footnote rows below the councils.
