# ScotGov CTAXBASE 2025: Band D equivalent dwellings for Scotland and each of the
# 32 council areas, every year from 1996 to 2025, before and after the council
# tax reduction scheme.
#
# The Scottish analogue of the England council tax base the wave-3 coverage audit
# found missing. Both worksheets are ported: the after-reduction figure is the
# one that corresponds to what uk-data multiplies by Band D, and the
# before-reduction figure is the publisher's own gross measure.
#
# The year headers are bare digits, which the guard contract cannot express as
# expected_column_header - it int-coerces digit expectations while comparing raw
# (the MYE precedent). Column identity therefore rests on the sha-pinned
# artifact and the per-row guards, and each year is its own record set.
#
# ScotGov's '&' spellings are aliased for the code lookup only; guards carry the
# publisher's exact string. Excluded: the footnote rows below the councils.
