# Scottish Government CTAXBASE 2023: number of chargeable dwellings on the valuation
# list at 4 September 2023, as reported by councils in the 'Council Tax Base'
# statistical return, by council tax band A-H plus total, for Scotland and the 32
# council areas (chronicle#262). Same concepts, measure ids and record-set shape as
# scotgov-council-tax-bands-2025; the Scotland row is the publisher's in-workbook sum
# of the council rows (checked cell for cell). Council codes and canonical names come
# from scotgov-band-d-equivalents-2025; guards carry the publisher's '&' spellings.
# Period: the count month, 2023-09. Excluded: the valuation band ranges and the
# ratio-to-Band-D rows, and the source and re-ordering notes below the councils.
