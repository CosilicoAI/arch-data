# Scottish Government Council Tax Collection Statistics, 2024-25 (an
# accredited official statistics publication, source: Council Tax Receipts
# Return, CTRR). Sheet 'Figure 1' prints, for every year billed from 1999-00
# to 2024-25, the net amount billed, the amount received as at 31 March 2025,
# the amount uncollected and the percentage received, for Scotland as a whole.
# Each year is its own record set because a period is not a measure;
# split-year labels store the opening year (2024-25 is fiscal_year 2024).
#
# Definition (publisher notes on the sheet and on the 'Data and Methodology'
# page): the amounts are net of discounts, exemptions and surcharges, after
# Council Tax Benefit/Reduction, exclude Water and Sewerage charges, are
# before any amounts written off for bad or doubtful debt, reflect corrections
# to liabilities made after billing, include any Cost of Living payments used
# to meet liabilities, and from 2005-06 include amounts from reduced second
# home and long-term empty property discounts and premiums. The 2024-25
# figures are provisional in-year figures; the earlier years are restated as
# at 31 March 2025, so this vintage's values for those years differ from the
# same years in other CTRR publications. Consumers selecting a year carried by
# more than one vintage pin the source_table.
#
# Ported: 26 years x net amount billed (column C), amount received (column D),
# amount uncollected (column E) and percentage received (column F, stored by
# the publisher as a fraction). Columns E and F are exact arithmetic over C
# and D in the workbook (uncollected = billed - received; percentage =
# received / billed) but the publisher prints them as values, not as labelled
# formulas, so they are carried; consumers should treat them as dependent on C
# and D. Values are the workbook's stored full-precision cells, not the
# rounded display (C12 is 3,076,769.838 thousand behind a '#,##0' format).
# Excluded: the two totals rows below the year rows ('Total for previous
# years' and the all-years total), which are sums over the ported rows. The
# other worksheets carry per-authority figures (wave-3 local-geography scope),
# Scotland-level collection-rate percentages by year and an 'Archived data'
# sheet for 1993-94 to 1998-99 as at 31 March 2019; only Figure 1's amounts
# are ported here. The exclusion rule used across the council-tax collection
# packages: within the selected table, only cells the publisher itself labels
# as arithmetic over other cells are left out.
#
# The workbook was fetched with browser headers (gov.scot has intermittently
# blocked non-browser fetches) and is pinned byte-for-byte (sha256 in
# manifest.yaml).
