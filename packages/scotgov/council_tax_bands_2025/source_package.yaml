# Scottish Government CTAXBASE 2025: number of chargeable dwellings at
# September 2025, Scotland row by council tax band A-H plus total. The
# Scotland row is publisher-emitted as in-workbook SUM formulas over the 32
# local-authority rows; the parser reads the publisher's cached computed
# values (total 2,623,149). The per-LA rows are wave-3 scope (#134).
# policyengine-uk-data downloads this workbook at runtime and falls back to
# hardcoded 2024-25 band shares x a hardcoded total when gov.scot blocks the
# fetch - that fallback is uk-data-computed and excluded per the facts-only
# ADR; this package pins the September-2025 publisher bytes (the fallback
# total matches this workbook's Scotland total exactly).
