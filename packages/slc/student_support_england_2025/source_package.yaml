# SLC 'Student support for higher education in England 2025' (slcsp052025):
# Table 3A maintenance loans (recipients in thousands, amounts in GBP
# million; Grand total rows over all providers and entry cohorts) and Table
# 4C (i) other targeted support (Adult Dependents Grant and Parents Learning
# Allowance, applicants awarded in thousands and amounts awarded in GBP
# million). Academic-year periods store the opening year (AY 2024/25 ->
# 2024) per the #131/#136 convention; policyengine-uk-data keys the same
# values to END-year calendars, a populace-side mapping. Cohort detail rows
# (Pre-2012 / Post-2012/13 / Post-2016/17) and the other 4C products
# (Childcare Grant, Travel Grant, totals) are named exclusions for the
# backfill lane. uk-data rounds the published GBP-million amounts to whole
# pounds (e.g. ADG 2013/14: 33.05009068m -> 33,050,091); the publisher
# precision is what lands here. Note 'Grand total ' carries a trailing
# space in the workbook - guards pin the exact cell text.
