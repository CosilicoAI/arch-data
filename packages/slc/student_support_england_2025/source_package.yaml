label: 'SLC student support for higher education in England 2025: maintenance loans (Table
  3A) and targeted support (Table 4C i), AY2013/14-2024/25'
dimension_labels:
  'slc.student_support_line': 'Student support line'
dimension_value_labels:
  'student_support_product':
    'adult_dependants_grant': 'Adult Dependants'' Grant'
    'parents_learning_allowance': 'Parents'' Learning Allowance'
