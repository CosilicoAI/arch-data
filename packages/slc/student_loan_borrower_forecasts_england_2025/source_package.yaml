# Student loan forecasts for England (DfE/SLC, Explore Education Statistics
# permalink), Table 6a: forecast borrowers liable to repay and earning above
# the repayment threshold, by product group and repayment plan, academic
# years 2024/25 to 2029/30. First consumer of the academic_year period type
# (#131/#136): fact periods store the OPENING year, while the EES value
# columns are named by the END year (value_2025 = AY 2024/25) - the exact
# leak the ALLOWED_PERIOD_TYPES caution warns about. All values are
# forecasts (the table is titled 'Forecast number of...'), so every record
# set carries model_output + assertion: source_projection; the uk_national
# profile must opt in via assertion_policy (#154). Null publisher cells
# (plan_3 rows for pre-masters products; Master's/Doctoral rows in years
# with no forecast) are skipped per year, not zero-filled.
# policyengine-uk-data keys these values to END-year calendars (its 2025 =
# AY 2024/25) and uses only the Higher education total rows - both
# populace-side declarations over these facts.
