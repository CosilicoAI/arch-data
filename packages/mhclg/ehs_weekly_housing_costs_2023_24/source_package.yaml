# English Housing Survey 2023-24 rented sectors report, Annex Table 1.7:
# mean and median weekly housing costs (GBP per week) for all households
# paying rent or mortgage, England, survey year April 2023 - March 2024
# (fiscal_year 2023). This is the publisher base behind uk-data's
# housing/rent_social target: the all-households 'all social renters' mean
# (118.12, published rounded 118) is uk-data's GBP 118/week; its x52 x5.0m
# UK-wide annualization is excluded (computed) - EHS covers England only and
# the 5.0m/5.4m/7.5m tenure counts uk-data multiplies by are unpinned '~'
# approximations with no published table (see the checklist row). The table
# also carries the private-renter mean (236.59) and the all-mortgagors mean
# (222.42, ~GBP 964/month) - the only sourced England anchor near uk-data's
# sourceless GBP 1,100/month mortgage payment. Whole-table port at national
# and region grain: six characteristic blocks (age of HRP, economic status,
# region, income quintile, housing support, dependent children) plus the
# all-households row, mean and median for the five tenure columns. Publisher
# markers preserved as record-set splits rather than skipped cells: the
# full-time-education row's mortgagor cells are 'u' (disclosure control,
# note 1) and the housing-support rows have no mortgagor columns at all
# (mortgagors are not eligible for housing support, note 3), so those two
# blocks carry the eight non-mortgagor measures only. Known publisher
# quirks: mortgagor costs include nominal GBP 0.02/week values (note 5),
# which is why the 75-or-over mortgagor median is 0.023 - note 5 is carried
# per-fact in the mortgagor measures' concept_evidence_notes, so bundle
# consumers see the caveat on the value itself (concept_alignment
# .evidence_notes), not only in this comment. Italic small-sample flags
# (note 2) are formatting the parser drops, but the property is fully
# recoverable, not lost: every italic cell has sample n <= 30 and every
# non-italic data cell has n >= 36 in the same table's per-tenure
# sample-size columns O-S, which remain in the committed sha-pinned ODS.
# Those columns are survey metadata, not facts (named exclusion). Shared
# owners are excluded by the publisher (note 4).
