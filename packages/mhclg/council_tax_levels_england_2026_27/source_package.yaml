# MHCLG Council Tax levels set by local authorities in England 2026-27, Table 10
# local authority level data: the council tax base and the average Band D
# council tax for each of the 296 billing authorities, for the current and
# previous year.
#
# This is one of the three publisher values the wave-3 coverage audit found
# missing. policyengine-uk-data reads a published Band D per authority and
# derives England's net council tax as taxbase x Band D; the product is
# excluded (computed) under the facts-only ADR, but both of its inputs are
# published, so both are ported here.
#
# Two periods, one record set each: the worksheet prints a previous-year and a
# current-year column for every item, and a period is not a measure. Split-year
# labels store the opening year, so 2025-26 is fiscal_year 2025.
#
# Excluded: the class-aggregate rows (England TE, inner and outer London
# boroughs, metropolitan and shire districts, unitary authorities), which are
# sums over the ported authorities; the whole "Re-organising authorities" block,
# a mid-reorganisation special case; and every percentage and increase-element
# column, which is arithmetic over ported values.
#
# The Band D measures aggregate as mean, not sum: the publisher's figure is an
# average per Band D equivalent dwelling, not a total.
