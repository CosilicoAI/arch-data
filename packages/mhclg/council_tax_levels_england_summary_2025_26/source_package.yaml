# MHCLG Council Tax levels set by local authorities in England 2025 to 2026,
# Tables 1 to 9 (revised; first published 20 March 2025, revised 25 April 2025
# and 22 April 2026, the last re-issue revising 2021-22 to 2025-26, so every
# year column carries '[r]'). Table 1 'Calculating council tax levels: England
# summary' prints, for 2021-22 to 2025-26, the council tax requirement
# including the adult social care precept and excluding parish precepts,
# parish precepts, the council tax requirement including both, the taxbase for
# council tax-setting purposes (millions of Band D equivalents) and the
# average Band D council tax with and without parish precepts.
#
# The requirement is the amount billing authorities budget to raise from
# council tax; it is net of local council tax support, which in England is a
# reduction of the taxbase rather than a published expenditure line, so no
# LCTS cost is printed in this workbook. It is the budget-basis companion to
# the billed and collectable totals; the England counterpart of the Scottish
# net amount billed and the Welsh net collectable debit is the net collectable
# debit in mhclg-council-tax-collection-england-2025-26.
#
# One record set per line and year, as in the OBR EFO packages: a period is
# not a measure, and the lines carry different units (GBP millions, millions
# of Band D equivalents, GBP per Band D dwelling). The
# requirement-including-parish-precepts row is the publisher's headline figure
# (GBP 44.1bn in 2025-26) and the two average Band D rows are the release's
# headline levels; all six rows are ported as printed. The publisher labels
# none of them as arithmetic, although the requirement row equals the two rows
# above it and the Band D rows are the requirement over the taxbase rounded to
# the penny. Split-year labels store the opening year: '2025 to 2026 [r]' is
# fiscal_year 2025. Per-authority figures are the existing Table 10 package
# family. The ods parser collapses whitespace and joins multi-paragraph cells
# with a space, so the guards carry that form.
