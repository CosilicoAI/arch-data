# MHCLG Collection rates for council tax and non-domestic rates in England
# 2025 to 2026 (QRC4 returns; the 2025-26 figures were revised to include
# Kensington & Chelsea in the re-issue gov.uk dates 31 July 2026, workbook
# dated 30 July 2026). Table 5 prints, for 2021-22 to 2025-26, the council tax
# net collectable debit and the amount collected in year, England, in GBP
# millions. The net collectable debit is the council tax that authorities
# would collect for the year if everyone liable had paid, after local council
# tax support, discounts and exemptions: the England counterpart of the
# Scottish net amount billed and the Welsh net collectable debit, and a
# billed-basis companion to the council tax requirement in the levels release.
#
# One record set per line and year, as in the OBR EFO packages. Ported: the
# two council tax amount rows x five years. Excluded: the two rows the
# publisher labels 'percentage change (%)' (their 2021-22 column compares with
# a 2020-21 base that is not printed in this artifact) and the four
# non-domestic rates rows (out of scope). The same release's Table 1 (receipts
# irrespective of the year billed) and Table 2 (collection rates by authority
# class) are not ported; the 2024-25 release prints identical values for
# 2021-22 to 2024-25 and adds only 2020-21, so it is superseded by this
# artifact. Split-year labels store the opening year: '2025 to 2026 [r]' is
# fiscal_year 2025.
