# DfT National Travel Survey table NTS0621, the frequency of local bus use for
# people aged 60 and over in England, on the same seven publisher bands as
# NTS0313. It is the age breakdown the follow-up asked for: NTS0621 against the
# all-ages local bus row of NTS0313 is the age contrast DfT publishes.
#
# The 60-and-over population is the concessionary travel age group in England,
# so this is also the closest published read on concessionary bus use
# frequency.
#
# Layout: the sheet is long over year and wide over the bands, so a record set
# selects one band column, and its rows are the sheet's row axis, which is the
# survey year. Period is a record-set property, so that comes to one record set
# per year and band with a single year row, and the transport mode and age band
# are shared filters: the sheet states both in its title rather than in a
# column.
#
# The publisher suppresses 2004 entirely ("[x]" across the row); that year is
# skipped rather than emitted.
#
# Joining to NTS0313: this package's transport_mode filter is the plain label
# "Local bus", because the mode is stated in the sheet title and never appears
# in a cell, while NTS0313 carries its own column value "Local bus [note 5]"
# verbatim. A consumer matching the two tables should join on the local_bus
# groupby value id rather than on the mode string. The frequency bands also
# differ in wording between the two sheets ("more than twice a month" here
# against "more than once or twice a month" there) for what the publisher
# documents as the same band; both are preserved as published.
schema_version: ledger.source_package.v1
package_id: dft-nts0621-local-bus-use-frequency-2025
label: DfT National Travel Survey frequency of local bus use, people aged 60 and over, England, 2003 to
  2025
artifact:
  source_name: dft
  source_table: 'NTS0621: Frequency of local bus use for those aged 60 years and over: England, 2003 onwards'
  resource_package: db
  resource_directory: data/dft/nts0621_local_bus_use_frequency_2025
  manifest: manifest.yaml
  vintage: '2025'
  extracted_at: '2026-09-10'
  extraction_method: ODS whole-workbook used-range cell parse
  parser: ods_used_range
  artifact_year: 2025
