# DfT National Travel Survey 2024, table NTS0205a: percentage of households
# with no / one / two-or-more cars or vans, from the published
# nts-2024-excel-tables.zip (member nts0205.xlsx). Publisher precision is
# ported (2024: 21.784588632006 / 44.2490898162473 / 33.9663215517466);
# policyengine-uk-data hand-transcribes the rounded 22/44/34 and multiplies
# by a hand-transcribed 29.6m UK household total - the products are excluded
# per the facts-only ADR, and applying England-resident NTS shares UK-wide is
# a populace-side declaration. Geography follows the workbook's note 3:
# rows prior to 1989 (1951/1961/1971/1981) are Great Britain; 1989 onwards
# are England - so the four decennial record sets carry K03000001 and, per
# note 2, name the pre-NTS household surveys as their instrument. Single-year
# rows only (1951-1981 decennial, 2002-2024 annual); the five combined-period
# rows (1985 to 1986 through 1998 to 2000) are excluded because a multi-year
# span has no calendar_year period representation - a named exclusion, not a
# data gap. The E-column guard pins each selected row to the table's
# all-households 100% check.
