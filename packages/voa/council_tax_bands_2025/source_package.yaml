# VOA Council Tax: stock of properties, 2025 (snapshot at 31 March 2025,
# month period 2025-03). Sheet CTSOP2.0 of the summary-tables workbook -
# publisher-emitted national and regional rows (England and Wales, England,
# Wales, nine English regions) plus the UNMD 'Unmatched' residual row
# (properties whose postcode could not be matched to a Westminster
# constituency, note 15; carried with a geography_match == unmatched
# identity on the England-and-Wales footprint). Additivity: England + Wales
# + Unmatched equals the England and Wales row within the publisher's
# nearest-10 cell rounding (every cell is independently rounded, so exact
# reconciliation is not expected; band I reconciles exactly). Band I exists
# only in Wales; the England and regional Band I cells are '[z]' (the
# accessible-tables shorthand for not applicable - England's 1993 valuation
# list has no Band I),
# so the workbook splits into two record sets: bands A-I + all-properties
# for the rows that carry Band I (England and Wales, Wales, Unmatched) and
# bands A-H + all-properties for England and the regions. PCON constituency
# rows (the bulk of the sheet) and the per-LA CTSOP1.1 zips are wave-3 scope
# (#134). policyengine-uk-data regex-discovers this workbook's URL at
# runtime with no committed fallback and keys the values to calendar 2025 -
# a populace-side timing declaration.
