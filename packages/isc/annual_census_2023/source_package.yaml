# ISC annual Census 2023 (survey January 2023, all schools in UK
# membership of ISC's constituent associations responding): 554,243
# pupils at 1,395 ISC member schools, from the census report PDF on
# the pdf_text_numbers lane. This is the true publisher behind
# policyengine-uk-data's obr/private_school_students target (557,000, the
# rounded January-2024 figure, tagged 'obr' and flat-filled 2018-2031 - the
# flat-fill is computed and excluded per the facts-only ADR; the relabel to
# an isc source is recorded in docs/pe-uk-source-checklist.md and closes the
# last wave-1 row of #132). ISC membership covers roughly half of UK
# independent schools and around four-fifths of independent-school pupils;
# mapping this membership count to the model's attends_private_school
# variable is a populace-side declaration.
