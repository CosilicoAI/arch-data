# Scotland's Census 2022 table UV113 (household composition, households) for
# Scotland, from the pinned NRS SuperWEB2 export published through the UK Data
# Service, Scotland's census dissemination partner. Census day is 2022-03-20, hence
# calendar_year 2022. The export is long format below a ten-line SuperWEB2
# preamble, so the artifact declares header_row 11. Every publisher category is
# carried with its exact label; the ': Total' roll-ups and 'All households' carry
# table_record_kind 'total'. NRS applies statistical disclosure control cell by
# cell ('Data has been perturbed'), so details need not sum to totals; values are
# carried as published and nothing is reconciled. Mapping the classification onto
# the ONS Families and households Table 7 categories is a consumer declaration
# (chronicle#237). Dependent child (Scotland's Census 2022 metadata): any person aged 0
# to 15 in a household, or aged 16 to 18 in full-time education living in a family with
# a parent or grandparent, excluding 16 to 18 year olds with a spouse, partner or child in
# the household; the same rule as England and Wales, with the one / two-or-more split of
# dependent children as the publisher's categories.
