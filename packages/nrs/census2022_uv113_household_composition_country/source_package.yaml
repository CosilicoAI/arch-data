    concept_relation: source_label
    concept_authority: nrs
    concept_evidence_url: https://statistics.ukdataservice.ac.uk/dataset/scotland-s-census-2022-uv113-household-composition-households
    concept_evidence_notes: 'Scotland''s Census 2022 table UV113 Household composition (households), country level, from the NRS SuperWEB2 export published through the UK Data Service; 26 publisher categories including the all-households, one-person, one-family, couple, lone-parent and other-household-type totals, which are carried as table_record_kind total. Scotland''s Census 2022 metadata, dependent child indicator: a dependent child is any person aged 0 to 15 in a household (whether or not in a family) or a person aged 16 to 18 who is in full-time education and living in a family with his or her parent(s) or grandparent(s); it does not include people aged 16 to 18 who have a spouse, partner or child living in the household (https://www.scotlandscensus.gov.uk/metadata/dependent-child-indicator/).'
