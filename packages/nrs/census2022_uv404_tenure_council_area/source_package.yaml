# Scotland's Census 2022 table UV404 (tenure of household) for the 32 council
# areas, from the pinned NRS SuperWEB2 export published through the UK Data
# Service, Scotland's census dissemination partner (the census website's own
# table builder serves the same cube interactively but publishes no stable
# file). Census day is 2022-03-20, hence calendar_year 2022.
#
# The export is long format below a ten-line SuperWEB2 preamble, so the
# artifact declares header_row 11. It carries council NAMES only; each row's
# S12 GSS code is authored from the publisher name and guarded by that exact
# name as the row header, the same authored-code pattern the repo's US state
# packages use for postal labels.
#
# Eight detail categories are ported plus the all-households total. The
# publisher roll-ups "Owned: Total" and "Private rented: Total" are not
# ported: they would double-count inside the owned/private buckets the spec
# ids define.
#
# NRS applies statistical disclosure control cell by cell, so this table does
# NOT add up and is not expected to: in 26 of the 32 councils the eight detail
# categories differ from the published all-households total, by -6 to +10
# households (median 3), and the dropped roll-ups likewise differ from the sum
# of their own details in 17 councils (-6 to +5). Scotland-wide the gap is 8
# households in 2,509,275. Every value is carried exactly as published and
# nothing is reconciled toward anything else - contrast the England and Wales
# leg, where TS054's details sum to the total in all 318 districts.
#
# Scotland's classification differs from England and Wales': social rented is
# one category (no council/housing-association split), and "Shared Equity
# (e.g. LIFT or Help-to-Buy)" has no E&W counterpart, so it carries its own
# shared_equity bucket rather than being forced into one.
#
# chronicle#253: the same 32 all-occupied-households cells are filed a second time
# as nrs.census2022.uv404.council.households on the local-authority households spec
# uk.local_geography.households.by_local_authority.v1 (domain household_count,
# geography groupby, the publisher's 'All occupied households' row label kept as the
# evidenced filter), mirroring the NRS constituency leg, so a consumer resolves all
# 361 UK local authorities from one spec. Same artifact, same rows, same values;
# the household_count domain keeps its fact and semantic keys distinct from the
# tenure record set above.
