  vintage: census_2022
  extracted_at: '2026-08-13'
  extraction_method: SuperWEB2 delimited text full-row parse below the export preamble,
    one source row per council area and tenure category
  parser: delimited_text_full_rows
  sheet_name: census2022_uv404_tenure_households_council_area.csv
  header_row: 11
  artifact_year: 2022
