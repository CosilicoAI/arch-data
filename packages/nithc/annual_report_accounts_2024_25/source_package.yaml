# Northern Ireland's bus public support and concessionary fares
# reimbursement, which the landed dfi-ni-public-transport-statistics-2024-25
# package could not carry: that release reports Translink journeys and
# passenger receipts and has no support or reimbursement series, and the DfI
# annual report and accounts for 2024-25 is not published. The publisher that
# does state the figures is the Northern Ireland Transport Holding Company,
# whose annual report and accounts are audited, laid before the Assembly and
# published under the Transport Act (Northern Ireland) 1967.
#
# Chronicle's call on the company-report question the follow-up left open: a
# statutory, audited public-corporation account is an acceptable publisher
# artifact. It is recorded as administrative provenance on an accrual basis,
# and the package takes only note 23, Related Party Transactions, whose lines
# name the Department for Infrastructure as the counterparty. That is the
# public support DfI paid, stated by the body that received it.
#
# Scope limit the consumer must carry: NITHC is the group holding company for
# Ulsterbus, Metro, Goldline and NI Railways, and the note does not split
# these transactions by mode. Public Service Obligation compensation and
# concessionary fare compensation are therefore all-public-transport figures,
# not bus-only, and every fact records mode_scope: all public transport so
# they cannot be read as a bus cell by mistake. The report has no segmental
# note that would allow a bus split.
#
# The report period ends in March, so the note's "2025" column is FY2024-25
# and its "2024" column is FY2023-24; both are ported.
