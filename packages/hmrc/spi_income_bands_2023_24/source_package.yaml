# SPI 2023-24 Tables 3.6/3.7: 13 total-income bands x 7 income types,
# counts (thousands, 1e3) + amounts (GBP million, 1e6); means are derivable
# and not ported. tax_year period 2023 (opening year; uk-data maps to 2024).
# Band lower bounds are numeric ODS cells, so numeric row-header guards
# work here. uk-data's 1.9x property-income scale (SPI-vs-ITSA coverage)
# and its uprated projections are populace-side adjustments, not facts.
# Same artifact populace's national HMRC stage parses (hmrc_income.py).
# Also not ported from Table 3.7: the 'Other income' Number/Amount pair
# (columns K/L) and both sheets' total-count column N - named exclusions,
# backfill candidates, not derivable from the ported columns.
