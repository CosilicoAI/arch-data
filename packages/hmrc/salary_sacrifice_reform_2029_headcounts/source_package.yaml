# HMRC policy paper 'Salary sacrifice reform for pension contributions'
# (published 2025-12-04, measure effective 6 April 2029), archived HTML on
# the html_tables_and_text document-numbers lane. Three published headcount
# estimates: 7.7 million employees using salary sacrifice for pension
# contributions, of whom 3.3 million sacrifice more than GBP 2,000 and 4.3
# million are within the GBP 2,000 threshold. The paper says 'the latest
# available data' without pinning a reference period and names no
# administrative source, so the counts carry provenance_class model_output
# (policy-costing estimates) and the period here is the publication year
# (2025) with UK geography inferred from the NICs scope; policyengine-uk-data's {2024: ...} keying plus
# its 2.4%-per-year growth extension are populace-side declarations excluded
# per the facts-only ADR. uk-data tags these targets 'obr'; the publisher is
# HMRC (relabel recorded in docs/pe-uk-source-checklist.md). The paper's
# NI-relief companions (GBP 1.2bn employee / 2.9bn employer) come from the
# separate 2025 SPP Review PDF, whose uk-data asset link is dead with no
# Wayback copy - tracked as blocked in the checklist.
