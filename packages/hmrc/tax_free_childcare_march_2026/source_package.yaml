    label: Annual-unique children with used Tax-Free Childcare accounts
    ordinal: 0
    column: E
    expected_column_header_row: 3
    expected_column_header: 'Children with used accounts: Total'
    concept: hmrc.tfc_children_with_used_accounts_annual_unique
    source_concept: hmrc.tax_free_childcare.children_with_used_accounts_total
    concept_relation: source_label
    concept_authority: hmrc
    concept_evidence_url: https://www.gov.uk/government/statistics/quality-report-tax-free-childcare/tax-free-childcare-quality-report
    concept_evidence_notes: HMRC defines used accounts as the preferred take-up measure. From April 2025,
