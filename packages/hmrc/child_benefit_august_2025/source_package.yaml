# HMRC Child Benefit statistics: annual release, data at August 2025 (main tables
# ODS, accredited official statistics, released 23 April 2026). Facts-only port of
# the publisher's UK time series and August-2025 cross-sections (chronicle#236):
# families and children registered for Child Benefit (Headline Tables A/B), in
# receipt of payment (Table 1A/1B, by claimant sex 1C, by number of children and
# child age band Table 2, by country/region Table 3, by single year of age Table
# 4), opted out of payment under the High Income Child Benefit Charge (Tables 9,
# 10 and 14), HMRC's published take-up ratio by age (Table 15) and the HICBC
# liability counts and revenue (Tables 16 and 17). Reference date is 31 August
# (May for Table 15), typed as the month period. HMRC rounds every figure
# separately, so components need not sum to totals; nothing is reconciled.
# Number-of-children and age-band categories are publisher column labels carried
# as measure dimensions. The local-authority and constituency tables (5, 6, 6a, 7,
# 11, 12, 12a) and the new-claim tables (8, 13) are in the pinned artifact but not
# ported here.
schema_version: ledger.source_package.v1
package_id: hmrc-child-benefit-august-2025
label: 'HMRC Child Benefit statistics, annual release August 2025: families and children registered, in payment and opted out, take-up by age, HICBC, United Kingdom'
dimension_labels:
  'geography': 'Geography'
  'hmrc.child_benefit_child_age': 'Child age'
  'hmrc.child_benefit_child_age_band': 'Child Benefit children by age band'
  'hmrc.child_benefit_claimant_sex': 'Child Benefit families by claimant sex'
  'hmrc.child_benefit_number_of_children': 'Child Benefit families by number of children'
  'hmrc.child_benefit_status': 'Child Benefit registrations and payments'
  'hmrc.hicbc_status': 'High Income Child Benefit Charge'
  'number_of_children': 'Number of Children'
dimension_value_labels:
  'child_age':
    'All ages': 'All ages'
  'child_age_band':
    'all': 'All ages'
    'under_5': 'Under 5'
    '5_to_10': '5 to 10'
    '11_to_15': '11 to 15'
    '16_and_over': '16 and over'
  'claimant_sex':
    'all': 'All'
    'men': 'Men'
    'women': 'Women'
    'unknown': 'Unknown'
  'hicbc_liability':
    'liable': 'Liable'
  'number_of_children':
    'all': 'All families'
    'one': 'One child'
    'two': 'Two children'
    'three': 'Three children'
    'four': 'Four children'
    'five_or_more': 'Five or more children'
    'five_to_nine': 'Five to nine children'
    'ten_or_more': 'Ten or more children'
  'payment_status':
    'registered': 'Registered'
    'in_payment': 'In payment'
    'opted_out': 'Opted out'
artifact:
  source_name: hmrc
  source_table: 'Child Benefit Statistics: Annual Release, data at August 2025, main tables'
  resource_package: db
  resource_directory: data/hmrc/child_benefit_august_2025
  manifest: manifest.yaml
  vintage: august_2025
  extracted_at: '2026-09-03'
  extraction_method: ODS whole-workbook used-range parse, guarded selectors on the headline and Tables 1, 2, 3, 4, 9, 10, 14, 15, 16 and 17
