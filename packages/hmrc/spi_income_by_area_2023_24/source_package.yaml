# HMRC Survey of Personal Incomes, tax year 2023 to 2024: income and tax by
# area, from the collated geography tables ODS. Table 3.15 is the Westminster
# parliamentary constituency cut on 2024 boundaries (worksheet note 2 records
# the 2023 Boundary Review change), Table 3.14 the borough, district and
# unitary authority cut; between them they carry the same 650 constituencies
# and 361 local authorities the population packages do.
#
# Publisher scaling, stated on each worksheet's row 3: taxpayer counts are in
# thousands and amounts in GBP millions, so those measures carry value_scale;
# means and medians are in pounds and carry none.
#
# Both sheets mix geography levels in one column - constituencies or local
# authorities alongside counties, regions and countries - so every row types
# itself from its GSS code. The sub-UK rows are ported as published; worksheet
# note 3 asks that sub-UK estimates be treated with caution, which is a
# consumer's judgement to make against a fact that exists, not a reason to drop
# it here.
#
# HMRC writes "[Not available]" where it suppresses a cell - most often the
# additional-rate taxpayer count in a constituency with too few of them. No
# fact is emitted for those: the publisher published no value. Rows are grouped
# by which measures they carry, so each record set below holds exactly the
# measures its rows state, and a suppressed cell is visible as the difference
# between the groups rather than as a zero or a null.
#
# There is NO income-amount column in either table. The publisher gives counts,
# means and medians per income type, and an amount only for total tax. The
# uk_local_geography profile's hmrc.employment_income.amount and
# hmrc.self_employment_income.amount targets therefore have no publisher fact:
# policyengine-uk-data forms them as count x mean, which is excluded (computed)
# under the facts-only ADR. Resolving those two targets is a profile decision,
# recorded on #134.
#
# Not ported from this artifact: the 3.12, 3.13, 3.13a, 3.14a and 3.15a
# worksheets. They are percentile and confidence-interval restatements of the
# same survey; no declared target needs them, and they would treble the package
# for no consumer.
