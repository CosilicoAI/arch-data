# NISRA mid-2024 population estimates for the 18 Northern Ireland seats of the
# 2024 UK Parliamentary Constituency boundaries, at five year age bands.
# Completes the constituency age family: 575 England and Wales seats from
# ONS/Nomis, 57 Scottish seats from NRS, 18 here, 650 in total.
#
# The artifact is the pinned NISRA PxStat CSV response for table MYE01T013,
# long format, one row per constituency x band x sex x year. NISRA names the
# geography dimension "Assembly Area (2024)" because Northern Ireland's
# Assembly and Westminster constituencies are coterminous; the codes are the
# GSS N05 Westminster constituency codes, which is what the profile resolves
# against.
#
# Scope of this package: the All persons rows at 2024. The Males and Females
# rows and the 2021-2023 years are in the artifact and are not ported - no
# profile target needs them and no consumer would reconcile a partial sex
# split. The N92000002 Northern Ireland rows are also not ported: that is a
# country-level total the national mid-year estimate packages already carry,
# and emitting it here would put two publishers' facts in one series. It is
# used as a verification anchor instead - the 18 constituencies sum to it.
schema_version: ledger.source_package.v1
package_id: nisra-pcon24-population-by-age-2024
label: 'NISRA mid-2024 population estimates: UK parliamentary constituencies (2024
  boundaries) in Northern Ireland, by five year age band'
dimension_labels:
  'age': 'Age'
artifact:
  source_name: nisra
  source_table: MYE01T013 Mid-year population estimates by Assembly Area (2024),
    five year age bands and sex
  resource_package: db
  resource_directory: data/nisra/pcon24_population_by_age_2024
  manifest: manifest.yaml
  vintage: mid_2024
  extracted_at: '2026-08-12'
  extraction_method: NISRA PxStat CSV response, delimited text full-row parse, one
    source row per constituency, band, sex and year
  parser: delimited_text_full_rows
  sheet_name: mye01t013_population_by_constituency_five_year_age_bands.csv
  artifact_year: 2024
