# NISRA Census 2021 households by household composition for Northern Ireland,
# from the pinned Flexible Table Builder extract (dataset HOUSEHOLD, variable
# HH_FAMILY_COMPOSITION_AGG23, the full 23-category classification). Census day is
# 2021-03-21, hence calendar_year 2021. The extract publishes no all-households row
# and no subtotals; every row is a leaf category with the publisher label as its
# identity. Northern Ireland splits lone-parent families by sex of the parent and
# separates 'Other family composition' single-family households; mapping onto the
# ONS Families and households Table 7 categories (or the England and Wales TS003
# classification) is a consumer declaration (chronicle#237). Dependent child (NISRA
# Census 2021 metadata): a person aged 0 to 15, or aged 16 to 18 who is a full-time
# student and in a family with a parent; NISRA's family definition includes grandparent
# households with no intervening parent, and children in couple families need not belong
# to both members of the couple. The same age rule as the other two legs, without the
# explicit spouse/partner/child exclusion that ONS and NRS state.
