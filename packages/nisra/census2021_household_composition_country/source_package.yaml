    concept_evidence_url: https://build.nisra.gov.uk/en/metadata/variable?d=HOUSEHOLD&v=HH_FAMILY_COMPOSITION_AGG23
    concept_evidence_notes: 'NISRA Census 2021 Flexible Table Builder, dataset HOUSEHOLD, variable HH_FAMILY_COMPOSITION_AGG23 (Household Composition, 23 categories), Northern Ireland total; the full classification is carried with the publisher labels, lone-parent categories split by sex of parent as published. NISRA Census 2021 variable metadata: a dependent child is a person in a household aged 0-15 (whether or not in a family) or a person aged 16-18 who is a full-time student and in a family with parent(s); a family is a couple (married, civil partnership or cohabiting) with or without children, or a lone parent and their children, and includes a couple with their grandchildren or a lone grandparent with their grandchildren where no parent in the intervening generation is in the household; children in couple families need not belong to both members of the couple.'
