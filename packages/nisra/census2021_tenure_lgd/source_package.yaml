# NISRA Census 2021 households by tenure for the 11 local government
# districts, from the pinned Flexible Table Builder extract (dataset
# HOUSEHOLD, variables LGD14 x HH_TENURE), long format, one row per district
# and tenure category. Census day is 2021-03-21, hence calendar_year 2021.
#
# The full HH_TENURE classification is ported (eleven categories), not the
# builder's four-category roll-up: the profile needs owned-outright and
# owned-with-mortgage separately, which only the full classification carries.
# The extract publishes no all-households row; district totals are the sum of
# the eleven categories, and the households family itself is batch-5 scope.
#
# Northern Ireland's classification splits social renting by landlord (Housing
# Executive / housing association) and private renting five ways; the bucket
# spec ids group them into the same social_rent and private_rent buckets the
# other census legs use.
schema_version: ledger.source_package.v1
package_id: nisra-census2021-tenure-lgd
label: 'NISRA Census 2021: households by tenure, local government districts'
dimension_labels:
  'tenure': 'Tenure'
artifact:
  source_name: nisra
  source_table: 'NISRA Census 2021 flexible table: households by tenure and local
    government district'
  resource_package: db
  resource_directory: data/nisra/census2021_tenure_lgd
  manifest: manifest.yaml
  vintage: census_2021
  extracted_at: '2026-08-13'
  extraction_method: Flexible Table Builder delimited text full-row parse, one source
    row per district and tenure category
  parser: delimited_text_full_rows
  sheet_name: census2021_tenure_households_by_lgd.csv
  artifact_year: 2021
