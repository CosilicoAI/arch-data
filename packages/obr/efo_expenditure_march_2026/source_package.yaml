# OBR EFO March 2026. Values are GBP billion in the workbook (value_scale 1e9).
# Fiscal-year periods store the opening year (FY2024-25 -> 2024), matching the
# hmrc fy2024_25 precedent. Explicit per-year record sets (not {year}
# templating) so the full 2024-2030 forecast surface lands in every build;
# see PolicyEngine/ledger#135 on bundle year handling. Row labels are exact
# FY2024-25 columns are labelled 'Outturn' in the workbooks, so the fy2024
# record sets carry assertion observation; fy2025-fy2030 remain
# source_projection. Row labels are exact
# cell text including OBR footnote markers (e.g. 'Incapacity benefits2').
# Table 4.1's council tax block is carried in full: the England, Scotland and
# Wales receipts rows, 'Total council tax receipts' (row 15, their sum), 'NI
# domestic rates', the 'Council tax accruals adjustment' (row 17), the
# 'High-value Council tax surcharge' (row 18, forecast from 2028-29 only; the
# earlier cells are blank and emit no facts) and 'Total net council tax
# receipts' (row 19, which equals rows 15 + 16 + 17 + 18). Consumers that bind
# a household council tax liability choose between the nation rows or row 15
# (cash receipts, GB) and row 19 (which adds NI domestic rates and the
# accruals adjustment); the percentage-change rows are not ported.
schema_version: ledger.source_package.v1
package_id: obr-efo-expenditure-march-2026
label: 'OBR EFO March 2026 detailed forecast tables: expenditure'
dimension_labels:
  'obr.efo_line': 'EFO table line'
artifact:
  source_name: obr
  source_table: 'EFO March 2026 detailed forecast tables: expenditure'
  resource_package: db
  resource_directory: data/obr/efo_expenditure_march_2026
