# ONS Price Index of Private Rents: average monthly private rent levels as
# quoted in the March-2026 'Private rent and house prices, UK' bulletin
# (released 2026-03-25). The bulletin prose carries the publisher-communicated
# country-level averages: UK GBP 1,374 / England 1,430 / Wales 828 / Scotland
# 1,022 at February 2026, and Northern Ireland 875 at December 2025 - NI's
# PIPR series lags the GB collection and the bulletin itself keys NI to
# December, so NI lands as its own record set at month 2025-12 rather than
# being dropped or mis-keyed. February 2026 is a provisional PIPR estimate
# (bulletin wording) subject to routine revision in later editions; it is an
# observation of an elapsed period, not a projection. The full monthly
# price-statistics workbook (25 March 2026 edition, ~47,800 rows x 40 columns
# covering regions, local authorities, bedroom counts and property types) is
# the natural backfill artifact, but the xlsx_used_range lane materialises
# its ~1.9M-cell grid on every bundle build, which is operationally
# prohibitive today - regional and property-size averages are therefore a
# named exclusion pending a row-filtered workbook lane, and local-authority
# grain is wave-3 scope (#134). All five quoted values were cross-checked
# against that workbook's Table 1 before authoring (rows verified equal).
# uk-data multiplies the UK figure by an unpinned ~5.4m renter-household
# count to build its rent_private target; the product is excluded (computed)
# per the facts-only ADR and stays a populace-side declaration. gov.uk/ONS
# pages embed per-request ids in page chrome, so the archived HTML is not
# byte-reproducible across fetches; the parsed statistical content is stable
# and the manifest sha pins the archived bytes (dwp-benefit-statistics
# precedent). The manifest source_url is the edition-pinned live bulletin
# path (ONS keeps each edition at its own /march2026 URL), not a separate
# archive service; the prose expected_value guards run only against the
# committed sha-pinned bytes (mirrored to R2), so a later re-publication
# that rewords the bulletin cannot silently break a build - re-ingesting a
# revised edition is a deliberate act that lands as a new artifact.
