# cells; the guard contract int-coerces digit expectations (_render_value)
# while guard comparison is raw, so those headers cannot be expressed as
# expected_column_header today. The age span is pinned by the guarded
# non-digit endpoints instead: 'All ages' and '90+', plus the sha-pinned
# artifact. One record set per age keeps single-age facts identity-distinct
