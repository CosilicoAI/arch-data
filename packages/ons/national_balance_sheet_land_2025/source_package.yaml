# ONS national balance sheet estimates, 2025 edition (released 2025-12-18):
# Land (AN.211) at current prices, GBP million (value_scale 1e6), end-of-year
# positions 1995-2024, for the whole economy (Table 2, series E44R), the
# households sector (Table 11, E44N) and non-financial corporations (Table 3,
# E43B). Rows 1987-1994 are blank in the workbook for these series - a named
# exclusion, not a data gap. Column guards pin the published CDIDs.
# Fidelity vs policyengine-uk-data (_land.py): its hand-transcribed totals
# match this edition exactly for 2021-2023 (7,106,785 / 7,138,696 /
# 6,756,315); its 2024 total (7,100,000) was an approximation of the
# published 7,117,771; and its 2020 household/corporate split (4,309,138 /
# 1,757,818) matches no series in this edition - an earlier, since-revised
# vintage. The fixed 2020 share split, the 2025/26 flat-fills, and the
# regional split over an unattributed prices-x-dwellings CSV are all
# uk-data-computed and excluded per the facts-only ADR; populace re-derives
# them over these raw sector series.
