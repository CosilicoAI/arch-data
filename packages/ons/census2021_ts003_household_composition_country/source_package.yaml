# Census 2021 TS003 household composition for England and Wales and its two
# constituent countries, from the pinned Nomis API response (2021 countries
# geography type, value measure). One record set per country; every row is one
# publisher category with its exact label as the categorical identity. The
# publisher's roll-up rows (Total: All households; One-person household; Single
# family household; the couple, lone-parent and other-family subtotals; Other
# household types) carry table_record_kind 'total', the leaf categories 'detail'.
# Census day is 2021-03-21, hence calendar_year 2021. Chronicle keeps the census
# classification as published: mapping it onto the ONS Families and households
# Table 7 categories (one-family vs multi-family, dependent vs non-dependent) is a
# consumer declaration (chronicle#237). Dependent child (ONS Census 2021 dictionary): a
# person aged 0 to 15, or aged 16 to 18 in full-time education living in a family with a
# parent or grandparent, excluding 16 to 18 year olds with a spouse, partner or child in
# the household.
