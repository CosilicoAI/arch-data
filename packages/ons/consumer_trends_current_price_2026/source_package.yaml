# ONS Consumer Trends, current price and not seasonally adjusted, sheets 04CN
# and 07CN: household final consumption expenditure on domestic energy, road
# fuels and passenger transport by road, annually from 2020 and quarterly from
# 2020 Q1.
#
# Both sheets are wide, one COICOP class per column and one period per row, so
# each COICOP class gets its own record set whose single row is the period row
# and whose filters carry coicop. That gives 04CN and 07CN the same shape:
# consumers select 04.5, 07.2.2 and 07.3.2 with one constraint key, and
# layout.groupby_value_id names the class on every fact rather than naming the
# class on 04CN and "all_households" on 07CN.
schema_version: ledger.source_package.v1
