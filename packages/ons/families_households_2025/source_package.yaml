# LFS-derived survey aggregates (survey_instrument: Labour Force Survey).
# Values are thousands (value_scale 1e3). Row headers are exact cell text
# including leading indentation and ONS note markers. The 2025 edition
# carries LFS-reweighted revisions of earlier years; deltas vs the June
# production fixture are enumerated at the populace consumption gate.
# Tables 5 and 7 (household size; households by household type) carry the
# household entity. Tables 1 and 3 (families by family type and presence of
# children; families with dependent children by number of dependent
# children, chronicle#235) carry the family entity, and every row lands as
# two measures from the same workbook row: the published estimate and the
# publisher's 'CI+/-' 95% confidence-interval half-width (statistic
# dimension), with the CV robustness-category letter guarded per row: the letter is
# lineage (a guard cell), not a fact, because the CI half-width already carries the
# published uncertainty and the CV band is a presentation of CI / estimate.
# Family-type roll-ups and the all-families rows are table_record_kind
# 'total'; lone mother and lone father rows partition the lone parent rows.
schema_version: ledger.source_package.v1
package_id: ons-families-households-2025
label: 'ONS families and households 2025, Tables 1, 3, 5 and 7: UK families by type and by number of dependent children, household size and households by household type, 2018-2025'
dimension_labels:
  'ons.family_type': 'Family type'
  'ons.household_size_summary': 'Household size summary'
  'ons.household_type': 'Household type'
  'children': 'Children'
  'family_type': 'Family Type'
  'household_type': 'Household type'
  'statistic': 'Statistic'
dimension_value_labels:
  'children':
    'all': 'All, with or without children'
    'dependent_children': 'Dependent children'
    'no_children': 'No children'
    'no_children_or_non_dependent_children_only': 'No children or non-dependent children only'
    'non_dependent_children_only': 'Non-dependent children only'
  'family_type':
    'all_families': 'All families'
    'married_couple': 'Married couple family'
    'civil_partner_couple': 'Civil partner couple family'
    'opposite_sex_cohabiting_couple': 'Opposite-sex cohabiting couple family'
    'same_sex_cohabiting_couple': 'Same-sex cohabiting couple family'
    'lone_parent': 'Lone parent family'
    'lone_mother': 'Lone mother family'
    'lone_father': 'Lone father family'
  'number_of_dependent_children':
    'all': 'Any number of dependent children'
    'one': 'One child'
    'two': 'Two children'
    'three_or_more': 'Three or more children'
  'statistic':
    'estimate': 'Estimate'
    'ci_95_half_width': '95% confidence interval half-width'
