# DWP's "household" is the Universal Credit unit of assessment (benefit unit),
# not an ONS household. The five family-type cells and Total below are separate
# publisher-emitted facts. DWP applies statistical disclosure control, so the
# published Total may differ slightly from the sum of the five detail cells.
schema_version: ledger.source_package.v1
package_id: dwp-uc-households-family-type-april-december-2025
label: 'DWP Stat-Xplore: Universal Credit benefit units by family type and published total, Great Britain, April to December 2023 through 2025'
artifact:
  source_name: dwp
  source_table: Households on Universal Credit by family type, April to December 2023 through 2025
  resource_package: db
  resource_directory: data/dwp/uc_households_family_type_april_december_2025
  manifest: manifest.yaml
  vintage: stat_xplore_2026_09_07
  extracted_at: '2026-09-07'
  extraction_method: >-
    Stat-Xplore publisher CSV download from table path "Households on Universal
    Credit / Family Type by Month" in database URI
    str:database:UC_Households, using measure URI
    str:count:UC_Households:V_F_UC_HOUSEHOLDS and dimension field URIs
    str:field:UC_Households:F_UC_HH_DATE:DATE_NAME and
    str:field:UC_Households:V_F_UC_HOUSEHOLDS:hnfamily_type; preserves five
    family-type rows, the publisher-emitted Total row, revision annotations,
    and the disclosure-control notice
  parser: delimited_text_full_rows
  header_row: 10
  selected_rows:
  - {Month: 'Single, no children'}
  - {Month: 'Single, with children'}
  - {Month: 'Couple, no children'}
  - {Month: 'Couple, with children'}
  - {Month: 'Unknown or missing family type'}
  - {Month: Total}
  sheet_name: stat_xplore_family_type
  artifact_year: 2025
