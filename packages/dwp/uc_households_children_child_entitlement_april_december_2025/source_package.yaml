# DWP's 'household' is the Universal Credit unit of assessment (benefit unit), not an ONS
# household. Each monthly cube cell is preserved as published; DWP applies cell-level
# adjustment at source, so independently queried cubes need not reconcile exactly.
# Stat-Xplore Open Data API extract (raw API response, query echoed inside it):
# Households on Universal Credit, Month x Number of Children x Child Entitlement, April
# to December 2025 (chronicle#233). Number of Children counts all children or young
# people under 20 declared as living in the household and verified by DWP, whether or
# not they are dependants of the claimant; Child Entitlement records whether the award
# includes a child element. Publisher categories are kept verbatim, including the
# 'Unknown or missing' and 'Not available prior to April 2019' cells.
