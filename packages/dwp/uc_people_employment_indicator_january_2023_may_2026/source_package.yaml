# DWP People on Universal Credit (Stat-Xplore UC_Monthly), person grain: both partners of a
# joint claim are counted, so these counts are not benefit-unit shares and do not
# reconcile with the UC_Households cubes. UC_Households carries no earnings or employment
# field (checked against the Stat-Xplore schema on 11 September 2026), which is why
# chronicle#259 item 4 lands on this dataset. January 2023 through May 2026 (41 months;
# 202606 is rejected), 18 August 2026 release. No Chronicle-side summation is emitted.
# Employment Indicator, banded value set C_UC_EMPLOYMENT_2023_BAND: 'In employment (PAYE) or
# self-employment' (HMRC Real Time Information PAYE earnings in the assessment period
# spanning the count date, or self-employed earnings reported to DWP), 'Not in employment
# (PAYE) or self-employment', and 'Not available'. The detailed value set (PAYE only,
# self-employment only, both) is not ported. The recode requests total: true, so DWP emits
# the all-people Total itself (.total record sets, employment_indicator: all).
# DWP holds the indicator for the latest month back until the next release (annotation V):
# in May 2026 every person is 'Not available', so the two employment categories are not
# ported for May 2026 (zeros by unavailability); that month's 'Not available' row and Total
# are. DWP marks April and May 2025 'rev': revised, and not previously on Stat-Xplore
# because the data was suspended.
schema_version: ledger.source_package.v1
package_id: dwp-uc-people-employment-indicator-january-2023-may-2026
label: 'DWP Stat-Xplore: People on Universal Credit by employment indicator, Great Britain, January 2023 to May 2026'
dimension_labels:
  'dwp.uc_employment_indicator': 'Employment Indicator'
artifact:
  source_name: dwp
  source_table: 'People on Universal Credit by employment indicator, January 2023 to May 2026'
  resource_package: db
  resource_directory: data/dwp/uc_people_employment_indicator_january_2023_may_2026
  manifest: manifest.yaml
  vintage: stat_xplore_2026_09_11
  extracted_at: '2026-09-11'
  extraction_method: >-
    Stat-Xplore Open Data API table response parsed and unpivoted to one row per cube cell;
    database str:database:UC_Monthly; measure str:count:UC_Monthly:V_F_UC_CASELOAD_FULL;
    fields in response order:
    str:field:UC_Monthly:F_UC_DATE:DATE_NAME;
    str:field:UC_Monthly:V_F_UC_CASELOAD_FULL:EMPLOYMENT_CODE;
    value sets: C_UC_DATE, C_UC_EMPLOYMENT_2023_BAND;
    months January 2023 through May 2026 (202301 through 202605), inclusive;
    recode total: true on EMPLOYMENT_CODE only, all other recodes total: false.
  parser: statxplore_table_json_rows
  sheet_name: api_response
  artifact_year: 2025
