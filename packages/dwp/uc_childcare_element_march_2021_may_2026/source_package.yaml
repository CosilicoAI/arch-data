# DWP 'Universal Credit childcare element statistics to May 2026', supplementary data tables,
# published 18 August 2026 with the Universal Credit quarterly statistics to 14 May 2026
# (chronicle#259 item 3). This package supersedes the retired
# dwp-uc-childcare-element-march-2021-august-2025: the same Table 1 three releases later, in
# which DWP revised 30 of the 54 overlapping months (by at most 5,000) and
# 9 Table 3 means (by at most GBP 10).
# Table 1: UC households receiving the childcare element (total, single, couple), rounded
# by DWP to the nearest 1,000. Table 3: mean monthly amount of the childcare element per
# household receiving it, rounded to the nearest GBP 10. DWP marks the most recent months
# provisional. DWP's UC household is the benefit unit of assessment, not an ONS household.
# No table publishes the total amount paid, so there is no childcare element amount fact:
# Chronicle does not multiply the count by the mean. Table 1 column F (children in
# childcare paid for by the element) and Tables 2 and 4 to 15 are not ported.
# Stat-Xplore's UC_Households dataset has no childcare field (checked against its schema on
# 11 September 2026), so this count cannot be split by payment indicator (chronicle#259
# item 1d): it covers all claims, including nil-payment ones.
# DWP's guidance: the claimant, or both claimants in a couple, must usually be in paid work
# and pay for childcare, and UC reimburses up to 85% of eligible costs up to a monthly
# maximum (GBP 1,071.09 for one child and GBP 1,836.16 for two or more in May 2026).
schema_version: ledger.source_package.v1
