# DWP's 'household' is the Universal Credit unit of assessment (benefit unit), not an ONS
# household. Each monthly cube cell is preserved as published; DWP applies cell-level
# adjustment at source, so independently queried cubes and their margins need not
# reconcile exactly. No Chronicle-side summation or reconciliation is emitted.
# Stat-Xplore Open Data API extract for chronicle#251. The window extends the issue's
# April to December 2025 request, at the maintainers' direction, to April 2023 through
# the latest published month, May 2026 (38 months).
# Both this extract and the #239 pairwise extracts use the 18 August 2026 DWP release.
# DWP marks June 2024 through February 2026 as revised ('r', 21 months), March through
# May 2026 as provisional ('p', 3 months), and April 2023 through May 2024 unmarked.
# No month gaps, refused combinations, new category codes, or suppressed '..' cells
# occurred; literal publisher zeros are retained. No fallback package is needed.
# DWP's Payment Indicator records whether a household with a calculated award received
# a payment in the month ('Yes') or had a nil award ('No'). Child Entitlement records
# whether the award includes a child element (responsibility for a child or qualifying
# young person). The two dimensions retain DWP's separate 'No'/'Yes' labels.
# Number of Children counts children or young people under 20 declared as living in
# the household and verified by DWP, whether or not they are claimant dependants;
# Chronicle preserves this publisher category and does not rename it qualifying children.
# Family Type 'with children' uses the same verified under-20 household membership.
