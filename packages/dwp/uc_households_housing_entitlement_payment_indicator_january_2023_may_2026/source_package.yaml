  manifest: manifest.yaml
  vintage: stat_xplore_2026_09_11
  extracted_at: '2026-09-11'
  extraction_method: >-
    Stat-Xplore Open Data API table response parsed and unpivoted to one row per cube cell;
    database str:database:UC_Households; measure str:count:UC_Households:V_F_UC_HOUSEHOLDS;
    fields in response order:
    str:field:UC_Households:F_UC_HH_DATE:DATE_NAME;
    str:field:UC_Households:V_F_UC_HOUSEHOLDS:TENURE;
    str:field:UC_Households:V_F_UC_HOUSEHOLDS:HCPAYMENT;
    value sets: C_UC_HH_DATE, C_UC_HOUSING_ENTITLEMENT, C_UC_PAYMENT;
    months January 2023 through May 2026 (202301 through 202605), inclusive;
    recode total: true on HCPAYMENT only, all other recodes total: false.
  parser: statxplore_table_json_rows
  sheet_name: api_response
  artifact_year: 2025
