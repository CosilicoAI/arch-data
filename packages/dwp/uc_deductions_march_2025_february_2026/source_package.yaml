# DWP calls the Universal Credit unit of assessment a household. It is a UC
# benefit unit, not an ONS household; see policyengine-uk-data#457. Table 1
# publishes rounded counts with a deduction and rounded shares of all UC units.
# The total-caseload facts divide those two publisher cells and round the result
# to 10,000. This is a deterministic within-row derivation, not a cross-source
# estimate. Calendar-year and plateau summaries remain consumer aggregations.
