# DWP's 'household' is the Universal Credit unit of assessment (benefit unit), not an ONS
# household. Each monthly cube cell is preserved as published; DWP applies cell-level
# adjustment at source, so independently queried cubes and their margins need not
# reconcile exactly. No Chronicle-side summation or reconciliation is emitted.
# Stat-Xplore Open Data API extract for chronicle#259: January 2023 through the latest
# published month, May 2026 (41 months; 202606 is rejected as an invalid value), from
# DWP's 18 August 2026 release. DWP marks June 2024 through February 2026 as revised
# ('r', 21 months), March through May 2026 as provisional ('p', 3 months), and January
# 2023 through May 2024 unmarked.
# DWP's Payment Indicator records whether a household with a calculated award received
# a payment in the month ('Yes') or had a nil award ('No'). The recode requests
# total: true on Payment Indicator only, so DWP emits the all-claims count itself as a
# Total item. Those rows sit in separate .total record sets with payment_indicator: all,
# measure total_benefit_units, and no payment-indicator constraint.
# Carer Entitlement, value set C_UC_CARER_ENTITLEMENT (No, Yes) (chronicle#259 item 1c).
# DWP adds the carer element where someone in the household has regular and substantial
# caring responsibilities for at least 35 hours a week; Carer's Allowance receipt is not
# part of the definition. One carer element per individual; a joint claim can carry two
# where the partners do not care for the same disabled person.
