# DWP FOI response FOI2025/24990 (2025-04-15): PIP daily living component
# claimants by award rate, caseload at end January 2025 (month 2025-01).
# This is the true publisher of policyengine-uk-data's pip_dl_standard/
# enhanced targets - uk-data cites the Jan-2026 PIP statistics publication,
# but those tables carry clearance/journey statistics only (scoping
# correction recorded on #133 and in docs/pe-uk-source-checklist.md).
# Publisher scope notes carried as constraints: DWP policy ownership
# (England, Wales and Abroad - hence geography K04000001 as the nearest GSS
# footprint, with the abroad tail disclosed here), working-age claimants,
# normal rules only (SREL excluded), rounded to the nearest 1,000. The FOI's
# less-than-4-points percentages (13% / 87%) belong to the withdrawn UC/PIP
# Bill analysis and are not ported - a named exclusion. Artifact provenance:
# WhatDoTheyKnow blocks automated fetches, so the response PDF was downloaded
# manually in a browser (2026-08-07) and registered from the local file; the
# manifest source_url is the canonical public attachment URL and the sha256
# pins the exact bytes.
