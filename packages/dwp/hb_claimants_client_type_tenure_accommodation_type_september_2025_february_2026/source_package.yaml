# DWP Housing Benefit caseload by accommodation type (Stat-Xplore hb_new), Great Britain, for
# chronicle#259 item 5. DWP publishes Accommodation Type from September 2025 (the breakdown
# was added in the February 2026 release); every earlier month of hb_new puts the whole
# caseload in 'Unknown / Missing' with zeros elsewhere, so this cube starts at September
# 2025 and no earlier zero is ported. September 2025 through February 2026 (6 months).
# Specified Accommodation is the supported housing defined in the Housing Benefit
# regulations (which includes exempt accommodation); Temporary Accommodation is housing a
# local authority or a registered housing association arranged by it provides to prevent
# homelessness; Other is every remaining claim. Client Type and Private or Social Rented
# request total: true (DWP-emitted margins in .total record sets); Accommodation Type has
# no Total, as the all-types count is dwp-hb-claimants-client-type-tenure-january-2023-
# february-2026. Literal publisher zeros (for example the unknown housing sector in
# specified accommodation) are retained. No Chronicle-side summation is emitted. The
# Glasgow City and Calderdale tenure annotations of the client type x tenure package apply.
