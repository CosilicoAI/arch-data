# DWP's 'household' is the Universal Credit unit of assessment (benefit unit), not an ONS
# household. Each monthly cube cell is preserved as published; DWP applies cell-level
# adjustment at source, so independently queried cubes need not reconcile exactly.
# Stat-Xplore Open Data API extract (raw API response, query echoed inside it):
# Households on Universal Credit in Scotland, Month x Age of Youngest Child (single
# year), April to December 2025 (chronicle#234; supersedes the May-2025 snapshot package
# dwp-uc-scotland-youngest-child-may-2025). Geography is recoded to Scotland and guarded
# by the S92000003 value URI on every row. The age-0 row is the publisher-precise value
# behind the 'Scotland UC households with a child under 1' target. Entity and concepts
# follow the April-December family-type and children packages (#188): benefit_unit,
# concept dwp.uc_benefit_units, source_concept dwp.uc_households, so the retired May
# package's dwp.uc_households source concept is kept.
