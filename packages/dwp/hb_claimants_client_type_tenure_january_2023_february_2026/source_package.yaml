# DWP Housing Benefit caseload (Stat-Xplore hb_new, from the Single Housing Benefit Extract),
# Great Britain, for chronicle#259 item 5. Monthly January 2023 through February 2026, the
# latest month on Stat-Xplore (38 months; 202603 is rejected). The count is Housing
# Benefit claimants: one per claim, made by a single claimant or a couple, normalized to
# benefit_unit. Client Type (Working age, Pension age) and Private or Social Rented (Social
# Rented Sector, Private Rented Sector, Unknown or missing housing sector) keep the
# publisher field keys client_type and private_or_social_rented. Both recodes request
# total: true, so DWP emits both margins and the grand total itself (.total record sets,
# all filters, no all constraint). No Chronicle-side summation is emitted.
# DWP's annotations on the response: Glasgow City misclassified tenure from February to
# October 2024, under-reporting the private rented sector; Calderdale has misclassified
# Local Housing Allowance claims since January 2024 (detailed housing type). Neither is
# corrected here. Accommodation type is the separate September 2025 onward package.
