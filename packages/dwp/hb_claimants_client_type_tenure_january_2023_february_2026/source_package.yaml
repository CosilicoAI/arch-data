  manifest: manifest.yaml
  vintage: stat_xplore_2026_09_11
  extracted_at: '2026-09-11'
  extraction_method: >-
    Stat-Xplore Open Data API table response parsed and unpivoted to one row per cube cell;
    database str:database:hb_new; measure str:count:hb_new:V_F_HB_NEW;
    fields in response order:
    str:field:hb_new:F_HB_NEW_DATE:NEW_DATE_NAME;
    str:field:hb_new:V_F_HB_NEW:PENWORK;
    str:field:hb_new:V_F_HB_NEW:TENURE_PUB;
    value sets: C_HB_NEW_DATE, C_HOUSING_SECTOR, C_PENWORK;
    months 202301 (Jan-23) through 202602 (Feb-26) (202301 through 202602), inclusive;
    recode total: true on PENWORK and TENURE_PUB only, all other recodes total: false.
  parser: statxplore_table_json_rows
  sheet_name: api_response
  artifact_year: 2025
