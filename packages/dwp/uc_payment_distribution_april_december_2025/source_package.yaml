# DWP's 'household' is the Universal Credit unit of assessment (benefit unit), not an ONS
# household. Each monthly cube cell is preserved as published; DWP applies cell-level
# adjustment at source, so independently queried cubes need not reconcile exactly.
# Stat-Xplore Open Data API extract (raw API response, query echoed inside it):
# Households on Universal Credit, Month x Monthly Award Amount (bands) x Family Type,
# April to December 2025 (chronicle#234; supersedes the May-2025 snapshot package
# dwp-uc-payment-distribution-may-2025). The publisher band list has 28 values: 'No
# payment', 15 bands of £100 up to £1,500, the '£1500.01 or over' band that DWP's
# metadata marks 'for months up to August 2022', and the eleven £100 bands above
# £1,500 plus '£2500.01 or over' that apply from September 2022. The pre-September-2022
# band does not apply to any month here (its 45 cells are 0 in the archived response,
# as they were in the retired May snapshot) and is not ported, so no fact exists under
# that label for a consumer to bind by mistake; the 27 ported bands are disjoint and
# partition the caseload. Every ported band keeps its exact publisher label as the
# categorical identity. Mapping labels to numeric monthly bounds (and any x12
# annualisation) is a downstream declaration.
# Entity and concepts follow the April-December family-type and children packages
# (#188): benefit_unit, concept dwp.uc_benefit_units, source_concept dwp.uc_households,
# so the retired May package's dwp.uc_households source concept is kept.
