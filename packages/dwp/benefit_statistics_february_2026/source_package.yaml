    expected_column_header_row: 1
    expected_column_header: numeric_value
    concept: dwp.jsa_claimants
    source_concept: dwp.jsa_claimants
    concept_relation: source_label
    concept_authority: dwp
    concept_evidence_url: https://www.gov.uk/government/statistics/dwp-benefit-statistics-february-2026/dwp-benefit-statistics-february-2026
    concept_evidence_notes: 'DWP benefit statistics February 2026 statistical summary, Jobseeker''s
      Allowance section: 71,000 JSA claimants at August 2025. The JSA scheme is effectively
      New Style (contributory) only; the mapping of this count to a contributory-JSA model
      variable is a populace-side declaration. The count is post-methodology-break: the publication
      states a methodological improvement applied from August 2025 data onwards removed a
